<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Prueba de acceso | EXENTIA</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf2f6;color:#0b2748;font:16px/1.5 system-ui;padding:24px}main{width:min(100%,430px);padding:32px;background:white;border:1px solid #d0dce7;border-radius:18px}h1{font-size:23px}header{text-align:center;font-weight:800;letter-spacing:2px;font-size:26px}small{display:block;font-size:11px;letter-spacing:1px}label{display:block;margin-top:16px}input,button{width:100%;padding:12px;border-radius:8px;border:1px solid #aabccc;font:inherit}button{margin-top:18px;background:#0b63ce;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.6}p{font-size:14px}a{color:#0b63ce}</style></head><body><main><header>EXENTIA<small>CONSULTING GROUP</small></header><h1>Prueba de acceso independiente</h1><p>Esta prueba no modifica el acceso actual al cotizador.</p><form id="login"><label for="user">Usuario</label><input id="user" type="email" autocomplete="username" required maxlength="254"><label for="pass">Contraseña propia de EXENTIA</label><input id="pass" type="password" autocomplete="current-password" required maxlength="1024"><button>Iniciar sesión</button></form><button id="logout" hidden>Cerrar sesión de prueba</button><p id="status" role="status" aria-live="polite"></p><a href="/acceso.html">Volver al acceso actual</a></main><script>const form=document.getElementById('login'),logout=document.getElementById('logout'),status=document.getElementById('status'),pass=document.getElementById('pass');async function check(){try{const r=await fetch('/api/auth-local',{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();form.hidden=d.authenticated;logout.hidden=!d.authenticated;status.textContent=d.authenticated?'Sesión independiente iniciada y verificada.':'Sin sesión independiente.'}catch(e){status.textContent='No se pudo verificar la sesión.'}}async function send(data){const r=await fetch('/api/auth-local',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.message||'No se pudo completar la solicitud.');await check()}form.addEventListener('submit',async e=>{e.preventDefault();const btn=form.querySelector('button');btn.disabled=true;try{await send({action:'login',username:document.getElementById('user').value,password:pass.value})}catch(e){status.textContent=e.message}finally{pass.value='';btn.disabled=false}});logout.onclick=async()=>{logout.disabled=true;try{await send({action:'logout'})}catch(e){status.textContent=e.message}finally{logout.disabled=false}};check();</script></body></html>
